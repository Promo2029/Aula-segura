<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaOrganizada - IA Educativa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        .layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            .layout {
                flex-direction: row;
            }
            .sidebar {
                width: 260px;
                min-height: 100vh;
            }
            .content {
                flex: 1;
            }
        }

        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            color: #4f46e5;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .streak-card {
            background: linear-gradient(135deg, #ff9d00, #ff5500);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(255, 123, 0, 0.2);
        }

        .streak-card .streak-count {
            font-size: 1.8rem;
            display: block;
            margin-top: 5px;
        }

        .menu-item {
            display: block;
            padding: 12px;
            color: #4b5563;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .menu-item.active, .menu-item:hover {
            background-color: #eef2ff;
            color: #4f46e5;
        }

        .content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1f2937;
        }

        .question-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .question-box p {
            font-weight: 600;
            margin-bottom: 10px;
            color: #111827;
        }

        .option-label {
            display: block;
            margin: 6px 0;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .result-pass {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .result-fail {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        input[type="file"] {
            margin-bottom: 12px;
            padding: 10px;
            width: 100%;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <h2>📚 AulaOrganizada</h2>
        
        <div class="streak-card">
            🔥 Racha de Estudio
            <span class="streak-count" id="streakDisplay">0 Días</span>
        </div>

        <a href="#" class="menu-item active">🏠 Inicio</a>
        <a href="#" class="menu-item">📝 Tareas</a>
        <a href="#" class="menu-item">🤖 Exámenes e IA</a>
    </div>

    <div class="content">
        <h1>Centro de Estudio e Inteligencia Artificial</h1>
        <p style="color: #6b7280; margin-bottom: 20px;">Sube tu material de estudio para generar evaluaciones personalizadas.</p>

        <div class="card">
            <h3>1. Cargar Documento de Estudio</h3>
            <input type="file" id="fileInput" accept=".txt">
            <button class="btn-primary" onclick="generateExam()">Generar Examen de 10 Preguntas</button>
        </div>

        <div class="card" id="examContainer" style="display: none;">
            <h3 id="examTitle">Examen Generado por IA</h3>
            <form id="quizForm">
                <div id="questionsList"></div>
                <button type="button" class="btn-primary" onclick="evaluateExam()" style="margin-top: 15px;">Enviar y Calificar Examen</button>
            </form>

            <div id="resultBox" class="result-box">
                <h2 id="scoreText">Nota: 0.0 / 5.0</h2>
                <p id="feedbackText"></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Manejo de la racha
    let streak = parseInt(localStorage.getItem('userStreak')) || 0;
    let lastExamDate = localStorage.getItem('lastExamDate') || "";

    function updateStreakDisplay() {
        document.getElementById('streakDisplay').innerText = `${streak} ${streak === 1 ? 'Día' : 'Días'}`;
    }

    updateStreakDisplay();

    let currentQuestions = [];

    function generateExam() {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                buildQuestionsFromText(text, file.name);
            };
            reader.readAsText(file, "UTF-8");
        } else {
            // Examen general por defecto
            buildQuestionsFromText("", "Conocimiento General");
        }
    }

    function buildQuestionsFromText(text, sourceName) {
        // Generación dinámica de 10 preguntas
        const cleanText = text.trim();
        const words = cleanText.split(/\s+/).filter(w => w.length > 4);

        currentQuestions = [];

        for (let i = 1; i <= 10; i++) {
            let topicWord = words[i * 2] || `Concepto #${i}`;
            topicWord = topicWord.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, "");

            if (text.length > 0) {
                currentQuestions.push({
                    q: `Según el documento "${sourceName}", ¿cuál es una afirmación correcta respecto a "${topicWord}"?`,
                    options: [
                        `Es un elemento clave presentado en el texto sobre ${topicWord}.`,
                        `Es un concepto secundario sin relevancia técnica.`,
                        `No corresponde al tema tratado en el archivo.`,
                        `Es una teoría descartada por el autor.`
                    ],
                    correct: 0
                });
            } else {
                currentQuestions.push({
                    q: `Pregunta ${i}: ¿Cuál es el procedimiento correcto para mantener un plan de estudio efectivo?`,
                    options: [
                        `Estudiar de manera constante todos los días.`,
                        `Estudiar únicamente el día antes del examen.`,
                        `No repasar los contenidos anteriores.`,
                        `Memorizar sin comprender el tema.`
                    ],
                    correct: 0
                });
            }
        }

        displayExam(sourceName);
    }

    function displayExam(sourceName) {
        const container = document.getElementById('questionsList');
        document.getElementById('examTitle').innerText = `Examen sobre: ${sourceName}`;
        container.innerHTML = "";

        currentQuestions.forEach((item, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-box';
            
            let optionsHTML = item.options.map((opt, optIndex) => `
                <label class="option-label">
                    <input type="radio" name="q${index}" value="${optIndex}"> ${opt}
                </label>
            `).join('');

            qDiv.innerHTML = `<p>${index + 1}. ${item.q}</p>${optionsHTML}`;
            container.appendChild(qDiv);
        });

        document.getElementById('examContainer').style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';
        window.scrollTo({ top: document.getElementById('examContainer').offsetTop, behavior: 'smooth' });
    }

    function evaluateExam() {
        let correctAnswers = 0;

        currentQuestions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.correct) {
                correctAnswers++;
            }
        });

        // Calificación escala colombiana 1.0 a 5.0 (Cada pregunta vale 0.4 + base 1.0)
        let grade = (1.0 + (correctAnswers * 0.4)).toFixed(1);
        if (grade > 5.0) grade = "5.0";

        const resultBox = document.getElementById('resultBox');
        const scoreText = document.getElementById('scoreText');
        const feedbackText = document.getElementById('feedbackText');

        resultBox.style.display = 'block';
        scoreText.innerText = `Nota Final: ${grade} / 5.0`;

        const today = new Date().toDateString();

        if (grade >= 3.0) {
            resultBox.className = "result-box result-pass";
            feedbackText.innerText = `¡Felicidades! Aprobaste con ${correctAnswers} de 10 respuestas correctas.`;

            // Aumentar racha solo si no ha presentado examen hoy
            if (lastExamDate !== today) {
                streak++;
                lastExamDate = today;
                localStorage.setItem('userStreak', streak);
                localStorage.setItem('lastExamDate', today);
                updateStreakDisplay();
                feedbackText.innerText += " 🔥 ¡Has aumentado tu racha de estudio +1 día!";
            }
        } else {
            resultBox.className = "result-box result-fail";
            feedbackText.innerText = `Obtuviste ${correctAnswers} de 10 correctas. Necesitas mínimo 3.0 para aprobar. ¡Sigue repasando!`;
        }
    }
</script>

</body>
</html>
