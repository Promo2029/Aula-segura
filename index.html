<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaOrganizada v8.5 - Tutor Académico Avanzado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        .layout { display: flex; flex-direction: column; min-height: 100vh; }
        @media (min-width: 768px) {
            .layout { flex-direction: row; }
            .sidebar { width: 280px; min-height: 100vh; }
            .content { flex: 1; }
        }
        
        /* BARRA LATERAL */
        .sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px; }
        .sidebar h2 { font-size: 1.4rem; color: #4f46e5; margin-bottom: 20px; }
        
        /* ESTADÍSTICAS: RACHA Y MONEDAS */
        .stats-container { display: flex; justify-content: space-between; margin-bottom: 20px; background: #fffbe0; padding: 10px; border-radius: 8px; border: 1px solid #ffe58f; }
        .stat-box { text-align: center; font-weight: bold; }
        .stat-box span { display: block; font-size: 1.2rem; color: #d97706; }

        .menu-btn { display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; color: #4b5563; border-radius: 8px; margin-bottom: 8px; font-weight: 500; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .menu-btn.active, .menu-btn:hover { background-color: #eef2ff; color: #4f46e5; font-weight: bold; }
        
        /* CONTENIDO Y TARJETAS */
        .content { padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #1f2937; }
        
        /* FORMULARIOS Y BOTONES */
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; font-size: 1rem; }
        textarea { resize: vertical; min-height: 80px; }
        .btn-primary { background-color: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; margin-top: 5px; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-ai { background-color: #059669; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 8px; }
        .btn-ai:hover { background-color: #047857; }
        
        /* ELEMENTOS DE LISTA */
        .item-card { background: #f8fafc; border-left: 4px solid #4f46e5; padding: 16px; border-radius: 6px; margin-bottom: 12px; }
        .item-card.exam-type { border-left-color: #ef4444; }
        .item-card.completed { opacity: 0.6; border-left-color: #10b981; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .task-btn { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        
        /* RESPUESTA DE LA IA */
        .ai-guide-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 16px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; font-size: 0.95rem; color: #1e1b4b; line-height: 1.6; }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <h2>📚 AulaOrganizada</h2>
        
        <!-- ESTADÍSTICAS DE GAMIFICACIÓN -->
        <div class="stats-container">
            <div class="stat-box">🔥 Racha<span id="rachaDisplay">0 días</span></div>
            <div class="stat-box">🪙 Monedas<span id="monedasDisplay">0</span></div>
        </div>

        <button class="menu-btn active" onclick="showTab('inicio', this)">🏠 Inicio</button>
        <button class="menu-btn" onclick="showTab('tareas', this)">📝 Tareas</button>
        <button class="menu-btn" onclick="showTab('examenes', this)">📅 Exámenes</button>
    </div>

    <div class="content">
        <!-- PESTAÑA INICIO -->
        <div id="tab-inicio" class="tab-section active">
            <h1>Resumen Académico</h1>
            <p style="color: #6b7280; margin-bottom: 20px;">Tu panel principal de control y gamificación.</p>
            
            <div class="card">
                <h3>🔔 Recordatorios Generales</h3>
                <button class="btn-primary" onclick="requestNotificationPermission()">Activar Notificaciones</button>
                <p id="notifStatus" style="font-size: 0.85rem; color: #6b7280; margin-top: 8px; text-align: center;"></p>
            </div>

            <div class="card">
                <h3>📝 Tareas Pendientes</h3>
                <div id="homeTaskList"></div>
            </div>
        </div>

        <!-- PESTAÑA TAREAS -->
        <div id="tab-tareas" class="tab-section">
            <h1>Gestión de Tareas</h1>
            <div class="card">
                <h3>Añadir Nueva Tarea</h3>
                <input type="text" id="taskTitle" placeholder="Ej: Ensayo sobre la Revolución Industrial...">
                <textarea id="taskDesc" placeholder="Detalles o instrucciones específicas..."></textarea>
                <input type="date" id="taskDate">
                <button class="btn-primary" onclick="addNewTask()">Guardar Tarea</button>
            </div>
            <div class="card">
                <h3>Mis Tareas Registradas</h3>
                <div id="taskListContainer"></div>
            </div>
        </div>

        <!-- PESTAÑA EXÁMENES -->
        <div id="tab-examenes" class="tab-section">
            <h1>Exámenes y Evaluaciones</h1>
            <div class="card">
                <h3>Programar Examen</h3>
                <input type="text" id="examTitleInput" placeholder="Ej: Parcial de Matemáticas Financieras...">
                <select id="examType">
                    <option value="Examen Escrito">Examen Escrito</option>
                    <option value="Exposición Oral">Exposición Oral</option>
                    <option value="Taller">Taller / Trabajo Final</option>
                </select>
                <input type="date" id="examDate">
                <textarea id="examTopics" placeholder="Temas específicos a evaluar..."></textarea>
                <button class="btn-primary" onclick="addNewExam()">Programar Evaluación</button>
            </div>
            <div class="card">
                <h3>Próximas Evaluaciones</h3>
                <div id="examListContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. ESTADO Y GAMIFICACIÓN (RACHA Y MONEDAS)
    // ==========================================
    let savedTasks = JSON.parse(localStorage.getItem('userTasks')) || [];
    let savedExams = JSON.parse(localStorage.getItem('userExams')) || [];
    
    let monedas = parseInt(localStorage.getItem('userMonedas')) || 0;
    let racha = parseInt(localStorage.getItem('userRacha')) || 0;
    let lastLogin = localStorage.getItem('lastLoginDate');

    function checkRacha() {
        const today = new Date().toDateString();
        if (lastLogin !== today) {
            let yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (lastLogin === yesterday.toDateString()) {
                racha += 1;
            } else if (lastLogin !== null) {
                racha = 1;
            } else {
                racha = 1;
            }
            lastLogin = today;
            localStorage.setItem('userRacha', racha);
            localStorage.setItem('lastLoginDate', lastLogin);
        }
        updateStatsUI();
    }

    function addMonedas(cantidad) {
        monedas += cantidad;
        localStorage.setItem('userMonedas', monedas);
        updateStatsUI();
        alert(`¡Felicidades! Has ganado ${cantidad} moneda(s) 🪙`);
    }

    function updateStatsUI() {
        document.getElementById('rachaDisplay').innerText = racha + " días";
        document.getElementById('monedasDisplay').innerText = monedas;
    }

    // ==========================================
    // 2. NAVEGACIÓN Y UTILIDADES
    // ==========================================
    function showTab(tabName, btnElement) {
        document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        if (btnElement) btnElement.classList.add('active');
    }

    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                document.getElementById('notifStatus').innerText = 
                    permission === "granted" ? "¡Notificaciones activadas!" : "Permiso denegado.";
            });
        }
    }

    // ==========================================
    // 3. GESTIÓN DE TAREAS Y EXÁMENES
    // ==========================================
    function addNewTask() {
        let title = document.getElementById('taskTitle').value.trim();
        let desc = document.getElementById('taskDesc').value.trim();
        let date = document.getElementById('taskDate').value;

        if (!title) return alert('Ingresa un título.');
        
        savedTasks.push({ id: Date.now(), title, desc, date: date || "Sin fecha", completed: false, guideText: null });
        localStorage.setItem('userTasks', JSON.stringify(savedTasks));
        
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskDate').value = '';
        renderAll();
    }

    function toggleTask(id) {
        let task = savedTasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            if(task.completed) {
                addMonedas(5);
            }
        }
        localStorage.setItem('userTasks', JSON.stringify(savedTasks));
        renderAll();
    }

    function addNewExam() {
        let title = document.getElementById('examTitleInput').value.trim();
        let type = document.getElementById('examType').value;
        let date = document.getElementById('examDate').value;
        let topics = document.getElementById('examTopics').value.trim();

        if (!title) return alert('Ingresa un título.');
        
        savedExams.push({ id: Date.now(), title, type, date: date || "Sin fecha", topics, studyText: null });
        localStorage.setItem('userExams', JSON.stringify(savedExams));
        
        document.getElementById('examTitleInput').value = '';
        document.getElementById('examTopics').value = '';
        document.getElementById('examDate').value = '';
        renderAll();
    }

    // ==========================================
    // 4. TUTOR ACADÉMICO INTELIGENTE Y PROFUNDO
    // ==========================================
    function generateDeepExplanation(title, details, type = 'tarea') {
        const cleanTitle = title.charAt(0).toUpperCase() + title.slice(1);
        const cleanDetails = details ? details : "Sin detalles adicionales específicos.";

        if (type === 'examen') {
            return `📖 [Explicación Académica y Guía de Estudio Detallada]\n\n` +
                   `🎯 **Tema Central**: ${cleanTitle}\n` +
                   `🔍 **Enfoque de Evaluación**: ${cleanDetails}\n\n` +
                   `💡 **1. Fundamentos Teóricos Explicados**:\n` +
                   `Para dominar "${cleanTitle}", debes comprender que su eje central radica en analizar los principios fundamentales y su impacto práctico. ` +
                   `Los conceptos clave que el profesor evaluará incluyen la definición formal, el contexto de aplicación y las variables críticas asociadas.\n\n` +
                   `🛠️ **2. Desglose de Temas Clave para Estudiar**:\n` +
                   `   • **Concepto y Origen**: Comprende qué es, cómo surge y por qué es relevante dentro de la materia.\n` +
                   `   • **Fórmulas, Reglas o Estructuras**: Repasa los componentes exactos que aplican a este tema.\n` +
                   `   • **Análisis Crítico**: Prepárate para argumentar ventajas, desventajas o implicaciones prácticas.\n\n` +
                   `📝 **3. Consejo de Preparación Exprés**:\n` +
                   `No te limites a memorizar. Intenta explicar este tema en voz alta estructurándolo en tres partes (Inicio, Desarrollo y Conclusión). Si puedes explicarlo sencillo, lo has dominado por completo.`;
        } else {
            return `📝 [Desarrollo y Asistencia Paso a Paso para la Tarea]\n\n` +
                   `🎯 **Título**: ${cleanTitle}\n` +
                   `📋 **Instrucciones Clave**: ${cleanDetails}\n\n` +
                   `📚 **1. Marco Teórico Explicativo**:\n` +
                   `El propósito de "${cleanTitle}" es desarrollar una investigación o resolución práctica basada en análisis riguroso. ` +
                   `Para abordarlo con éxito, es vital establecer un marco conceptual claro que responda a la pregunta central del tema.\n\n` +
                   `⚙️ **2. Guía de Redacción / Resolución Paso a Paso**:\n` +
                   `   • **Paso 1 (Introducción)**: Presenta el tema definiendo los términos principales y el objetivo del trabajo.\n` +
                   `   • **Paso 2 (Desarrollo y Argumentación)**: Desglosa los puntos principales. Si requiere datos o ejemplos, inclúyelos aquí para dar solidez.\n` +
                   `   • **Paso 3 (Conclusión / Cierre)**: Redacta una síntesis personal o crítica que conecte lo aprendido con la realidad del área de estudio.\n\n` +
                   `✨ **3. Recomendación Final**:\n` +
                   `Sigue esta estructura formal para garantizar que tu trabajo cumpla con todos los criterios de excelencia académica. ¡Mucho éxito!`;
        }
    }

    async function generateTaskGuide(id) {
        let task = savedTasks.find(t => t.id === id);
        if (!task) return;

        let btn = document.getElementById(`btn-task-${id}`);
        btn.disabled = true;
        btn.innerText = "⏳ Generando explicación detallada...";

        setTimeout(() => {
            task.guideText = generateDeepExplanation(task.title, task.desc, 'tarea');
            localStorage.setItem('userTasks', JSON.stringify(savedTasks));
            renderAll();
        }, 300);
    }

    async function generateExamStudy(id) {
        let exam = savedExams.find(e => e.id === id);
        if (!exam) return;

        let btn = document.getElementById(`btn-exam-${id}`);
        btn.disabled = true;
        btn.innerText = "⏳ Generando guía de estudio...";

        setTimeout(() => {
            exam.studyText = generateDeepExplanation(exam.title, exam.topics, 'examen');
            localStorage.setItem('userExams', JSON.stringify(savedExams));
            renderAll();
        }, 300);
    }

    // ==========================================
    // 5. RENDERIZADO VISUAL
    // ==========================================
    function renderAll() {
        // Tareas
        let taskCont = document.getElementById('taskListContainer');
        taskCont.innerHTML = savedTasks.map(t => `
            <div class="item-card ${t.completed ? 'completed' : ''}">
                <div class="item-header">
                    <strong>${t.title}</strong>
                    <button class="task-btn" onclick="toggleTask(${t.id})">${t.completed ? 'Deshacer' : 'Completar (+5 🪙)'}</button>
                </div>
                <p style="font-size: 0.85rem;">${t.desc}</p>
                <small>📅 Entrega: ${t.date}</small><br>
                <button id="btn-task-${t.id}" class="btn-ai" onclick="generateTaskGuide(${t.id})">🤖 Explicación Detallada</button>
                ${t.guideText ? `<div class="ai-guide-box">${t.guideText}</div>` : ''}
            </div>
        `).join('') || '<p style="color: #9ca3af;">No hay tareas registradas.</p>';

        // Exámenes
        let examCont = document.getElementById('examListContainer');
        examCont.innerHTML = savedExams.map(e => `
            <div class="item-card exam-type">
                <div class="item-header"><strong>[${e.type}] ${e.title}</strong></div>
                <p style="font-size: 0.85rem;">Temas: ${e.topics}</p>
                <small style="color: red;">📅 Fecha: ${e.date}</small><br>
                <button id="btn-exam-${e.id}" class="btn-ai" onclick="generateExamStudy(${e.id})">🤖 Guía de Estudio Profunda</button>
                ${e.studyText ? `<div class="ai-guide-box">${e.studyText}</div>` : ''}
            </div>
        `).join('') || '<p style="color: #9ca3af;">No hay exámenes programados.</p>';

        // Resumen Inicio
        let homeTask = document.getElementById('homeTaskList');
        let pending = savedTasks.filter(t => !t.completed);
        homeTask.innerHTML = pending.map(t => `<div style="padding: 6px 0; border-bottom: 1px solid #e2e8f0;"><strong>${t.title}</strong> - <small style="color: #4f46e5;">📅 ${t.date}</small></div>`).join('') || '<p style="color: #9ca3af;">Todo al día 🎉</p>';
    }

    // Inicializar al cargar
    window.onload = () => {
        checkRacha();
        renderAll();
    };
</script>

</body>
</html>
