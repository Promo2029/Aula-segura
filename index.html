<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaOrganizada v1.4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        .layout {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @media (min-width: 768px) {
            .layout { flex-direction: row; }
            .sidebar { width: 270px; min-height: 100vh; }
            .content { flex: 1; }
        }

        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            color: #4f46e5;
            margin-bottom: 20px;
        }

        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            color: white;
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .streak-card {
            background: linear-gradient(135deg, #ff9d00, #ff5500);
            box-shadow: 0 4px 6px rgba(255, 123, 0, 0.2);
        }

        .coins-card {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }

        .stat-card .stat-count {
            font-size: 1.4rem;
            display: block;
            margin-top: 4px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 12px;
            background: none;
            border: none;
            color: #4b5563;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
        }

        .menu-btn.active, .menu-btn:hover {
            background-color: #eef2ff;
            color: #4f46e5;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-section { display: none; }
        .tab-section.active { display: block !important; }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1f2937;
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        textarea { resize: vertical; min-height: 90px; }

        input[type="file"] {
            margin-bottom: 12px;
            padding: 10px;
            width: 100%;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
        }

        .btn-primary:hover { background-color: #4338ca; }

        .item-card {
            background: #f8fafc;
            border-left: 4px solid #4f46e5;
            padding: 14px 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-card.exam-type { border-left-color: #ef4444; }

        .task-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .question-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .question-box p { font-weight: 600; margin-bottom: 10px; color: #111827; }
        .option-label { display: block; margin: 8px 0; cursor: pointer; font-size: 0.95rem; }

        .result-box {
            display: none;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .result-pass { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .result-fail { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .ai-response {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            white-space: pre-wrap;
            display: none;
        }
    </style>
    <script>
        // LÓGICA DE NAVEGACIÓN Y PESTAÑAS (Al inicio para garantizar ejecución)
        function showTab(tabName, btnElement) {
            var sections = document.getElementsByClassName('tab-section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].style.display = 'none';
            }

            var buttons = document.getElementsByClassName('menu-btn');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].classList.remove('active');
            }

            var target = document.getElementById('tab-' + tabName);
            if (target) {
                target.style.display = 'block';
            }

            if (btnElement) {
                btnElement.classList.add('active');
            }
        }

        // Variables de almacenamiento local
        var streak = parseInt(localStorage.getItem('userStreak')) || 0;
        var coins = parseInt(localStorage.getItem('userCoins')) || 0;
        var lastExamDate = localStorage.getItem('lastExamDate') || "";
        var savedTasks = JSON.parse(localStorage.getItem('userTasks')) || [];
        var savedExams = JSON.parse(localStorage.getItem('userExams')) || [];

        function updateStatsDisplay() {
            var streakEl = document.getElementById('streakDisplay');
            var coinsEl = document.getElementById('coinsDisplay');
            if (streakEl) streakEl.innerText = streak + (streak === 1 ? ' Día' : ' Días');
            if (coinsEl) coinsEl.innerText = coins;
        }

        function requestNotificationPermission() {
            var status = document.getElementById('notifStatus');
            if ("Notification" in window) {
                Notification.requestPermission().then(function(permission) {
                    if (permission === "granted") {
                        status.innerText = "¡Notificaciones activadas correctamente!";
                    } else {
                        status.innerText = "Permiso de notificaciones denegado.";
                    }
                });
            } else {
                status.innerText = "Este navegador no soporta notificaciones.";
            }
        }

        function addNewTask() {
            var title = document.getElementById('taskTitle').value.trim();
            var desc = document.getElementById('taskDesc').value.trim();
            var date = document.getElementById('taskDate').value;
            var fileInput = document.getElementById('taskFile');
            var file = fileInput.files[0];

            if (!title) {
                alert('Por favor ingresa el título de la tarea.');
                return;
            }

            savedTasks.push({
                id: Date.now(),
                title: title,
                desc: desc || "Sin descripción",
                date: date || "Sin fecha",
                fileName: file ? file.name : null,
                completed: false
            });

            localStorage.setItem('userTasks', JSON.stringify(savedTasks));
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskDate').value = '';
            fileInput.value = '';
            renderTasks();
        }

        function renderTasks() {
            var container = document.getElementById('taskListContainer');
            if (!container) return;

            if (savedTasks.length === 0) {
                container.innerHTML = '<p style="color: #9ca3af;">No tienes tareas guardadas.</p>';
                return;
            }

            container.innerHTML = '';
            for (var i = 0; i < savedTasks.length; i++) {
                var task = savedTasks[i];
                var div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = '<div>' +
                    '<strong>' + task.title + '</strong>' +
                    '<p style="font-size: 0.85rem; color: #4b5563;">' + task.desc + '</p>' +
                    '<small style="color: #6b7280;">📅 Fecha: ' + task.date + (task.fileName ? ' | 📎 ' + task.fileName : '') + '</small>' +
                    '</div>' +
                    '<button class="task-btn" onclick="toggleTask(' + task.id + ')">' + (task.completed ? '✓ Listo' : 'Marcar Lista') + '</button>';
                container.appendChild(div);
            }
        }

        function toggleTask(id) {
            for (var i = 0; i < savedTasks.length; i++) {
                if (savedTasks[i].id === id) {
                    savedTasks[i].completed = !savedTasks[i].completed;
                }
            }
            localStorage.setItem('userTasks', JSON.stringify(savedTasks));
            renderTasks();
        }

        function addNewExam() {
            var title = document.getElementById('examTitleInput').value.trim();
            var type = document.getElementById('examType').value;
            var date = document.getElementById('examDate').value;
            var topics = document.getElementById('examTopics').value.trim();

            if (!title) {
                alert('Por favor ingresa el nombre de la evaluación.');
                return;
            }

            savedExams.push({
                id: Date.now(),
                title: title,
                type: type,
                date: date || "Sin fecha",
                topics: topics || "Temas generales"
            });

            localStorage.setItem('userExams', JSON.stringify(savedExams));
            document.getElementById('examTitleInput').value = '';
            document.getElementById('examTopics').value = '';
            document.getElementById('examDate').value = '';
            renderExams();
        }

        function renderExams() {
            var container = document.getElementById('examListContainer');
            if (!container) return;

            if (savedExams.length === 0) {
                container.innerHTML = '<p style="color: #9ca3af;">No tienes evaluaciones programadas.</p>';
                return;
            }

            container.innerHTML = '';
            for (var i = 0; i < savedExams.length; i++) {
                var exam = savedExams[i];
                var div = document.createElement('div');
                div.className = 'item-card exam-type';
                div.innerHTML = '<div>' +
                    '<strong>[' + exam.type + '] ' + exam.title + '</strong>' +
                    '<p style="font-size: 0.85rem; color: #4b5563;">Temas: ' + exam.topics + '</p>' +
                    '<small style="color: #ef4444; font-weight: bold;">📅 Fecha: ' + exam.date + '</small>' +
                    '</div>';
                container.appendChild(div);
            }
        }

        function generateAIHelp() {
            var topic = document.getElementById('aiTopic').value.trim();
            var option = document.getElementById('aiOption').value;
            var responseBox = document.getElementById('aiResponseBox');

            if (!topic) {
                alert('Por favor escribe un tema.');
                return;
            }

            responseBox.style.display = 'block';

            if (option === 'exposicion') {
                responseBox.innerText = '📢 GUIÓN SUGERIDO PARA TU EXPOSICIÓN SOBRE "' + topic.toUpperCase() + '":\n\n' +
                '1. INTRODUCCIÓN:\n"Buenos días/tardes. Hoy les hablaré sobre ' + topic + '..."\n\n' +
                '2. PUNTOS CLAVE:\n- Definición general.\n- Importancia y características.\n- Ejemplo de aplicación.\n\n' +
                '3. CONCLUSIÓN:\n"En resumen, ' + topic + ' es fundamental porque... Gracias por su atención."';
            } else {
                responseBox.innerText = '💡 EXPLICACIÓN SENCILLA SOBRE "' + topic.toUpperCase() + '":\n\n' +
                '• Concepto: Es un punto principal clave para tu materia.\n' +
                '• Utilidad: Te ayuda a estructurar tus respuestas en exámenes de forma clara y lógica.';
            }
        }

        var currentQuestions = [];

        function handleFileUpload() {
            var fileInput = document.getElementById('fileInput');
            var status = document.getElementById('statusMessage');
            var file = fileInput.files[0];

            if (!file) {
                status.innerText = "Generando examen de prueba general...";
                buildQuestionsFromText("", "Conocimiento General");
                return;
            }

            status.innerText = "Procesando archivo...";
            var reader = new FileReader();
            reader.onload = function(e) {
                status.innerText = "";
                buildQuestionsFromText(e.target.result, file.name);
            };
            reader.readAsText(file, "UTF-8");
        }

        function buildQuestionsFromText(text, sourceName) {
            var cleanText = text.trim();
            var words = cleanText.split(/\s+/).filter(function(w) { return w.length > 4; });

            currentQuestions = [];

            for (var i = 1; i <= 10; i++) {
                var topicWord = words[i * 2] || words[i] || ("Concepto " + i);
                topicWord = topicWord.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, "");

                if (cleanText.length > 0) {
                    currentQuestions.push({
                        q: 'Según el documento "' + sourceName + '", ¿cuál es un aspecto relevante sobre "' + topicWord + '"?',
                        options: [
                            'Es un punto central abordado en el texto.',
                            'Es un detalle secundario sin importancia.',
                            'No tiene relación con el tema.',
                            'Es una teoría totalmente descartada.'
                        ],
                        correct: 0
                    });
                } else {
                    currentQuestions.push({
                        q: 'Pregunta ' + i + ': ¿Cuál es la mejor estrategia para preparar tus exámenes?',
                        options: [
                            'Repasar con tiempo y realizar exámenes de práctica.',
                            'Estudiar solo 5 minutos antes.',
                            'No tomar apuntes en clase.',
                            'Memorizar sin entender nada.'
                        ],
                        correct: 0
                    });
                }
            }

            displayExam(sourceName);
        }

        function displayExam(sourceName) {
            var container = document.getElementById('questionsList');
            document.getElementById('examTitle').innerText = 'Examen Práctico sobre: ' + sourceName;
            container.innerHTML = "";

            for (var index = 0; index < currentQuestions.length; index++) {
                var item = currentQuestions[index];
                var qDiv = document.createElement('div');
                qDiv.className = 'question-box';

                var optionsHTML = '';
                for (var optIndex = 0; optIndex < item.options.length; optIndex++) {
                    optionsHTML += '<label class="option-label"><input type="radio" name="q' + index + '" value="' + optIndex + '"> ' + item.options[optIndex] + '</label>';
                }

                qDiv.innerHTML = '<p>' + (index + 1) + '. ' + item.q + '</p>' + optionsHTML;
                container.appendChild(qDiv);
            }

            document.getElementById('examContainer').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';
        }

        function evaluateExam() {
            var correctAnswers = 0;

            for (var index = 0; index < currentQuestions.length; index++) {
                var selected = document.querySelector('input[name="q' + index + '"]:checked');
                if (selected && parseInt(selected.value) === currentQuestions[index].correct) {
                    correctAnswers++;
                }
            }

            var grade = (1.0 + (correctAnswers * 0.4)).toFixed(1);
            if (grade > 5.0) grade = "5.0";

            var resultBox = document.getElementById('resultBox');
            var scoreText = document.getElementById('scoreText');
            var feedbackText = document.getElementById('feedbackText');

            resultBox.style.display = 'block';
            scoreText.innerText = 'Nota Final: ' + grade + ' / 5.0';

            var today = new Date().toDateString();

            if (grade >= 3.0) {
                resultBox.className = "result-box result-pass";
                coins += 20;
                localStorage.setItem('userCoins', coins);

                var bonusText = " 🪙 ¡Ganaste +20 monedas!";

                if (lastExamDate !== today) {
                    streak++;
                    lastExamDate = today;
                    localStorage.setItem('userStreak', streak);
                    localStorage.setItem('lastExamDate', today);
                    bonusText += " 🔥 ¡Racha +1 día!";
                }

                feedbackText.innerText = '¡Felicidades! Aprobaste con ' + correctAnswers + ' de 10 respuestas correctas.' + bonusText;
                updateStatsDisplay();
            } else {
                resultBox.className = "result-box result-fail";
                feedbackText.innerText = 'Obtuviste ' + correctAnswers + ' de 10 correctas. Necesitas mínimo 3.0 para aprobar. ¡Sigue intentándolo!';
            }
        }

        // Carga inicial al abrir la página
        window.onload = function() {
            showTab('inicio');
            updateStatsDisplay();
            renderTasks();
            renderExams();
        };
    </script>
</head>
<body>

<div class="layout">
    <div class="sidebar">
        <h2>📚 AulaOrganizada</h2>
        
        <div class="stats-container">
            <div class="stat-card streak-card">
                🔥 Racha
                <span class="stat-count" id="streakDisplay">0 Días</span>
            </div>
            <div class="stat-card coins-card">
                🪙 Monedas
                <span class="stat-count" id="coinsDisplay">0</span>
            </div>
        </div>

        <button class="menu-btn active" onclick="showTab('inicio', this)">🏠 Inicio</button>
        <button class="menu-btn" onclick="showTab('tareas', this)">📝 Tareas</button>
        <button class="menu-btn" onclick="showTab('examenes', this)">📅 Exámenes</button>
        <b
